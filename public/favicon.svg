  <rect x="180" y="180" width="36" height="152" rx="10" fill="#38bdf8"/>
  <rect x="130" y="200" width="36" height="112" rx="10" fill="#60a5fa"/>
  <!-- Right Weight Plates -->
  <rect x="296" y="180" width="36" height="152" rx="10" fill="#38bdf8"/>
  <rect x="346" y="200" width="36" height="112" rx="10" fill="#60a5fa"/>
  <!-- Bar Collar rings -->
  <circle cx="226" cy="256" r="10" fill="#93c5fd"/>
  <circle cx="286" cy="256" r="10" fill="#93c5fd"/>
